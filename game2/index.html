<!doctype html>
<html><head><meta charset="utf-8"><title>Echo Vault</title>
<style>
body{margin:0;background:#12141c;color:#dde;font:16px system-ui,sans-serif;text-align:center}
canvas{margin-top:12px;background:#1b1f2b;border-radius:8px}
#hud{margin:10px}small{color:#8a91a8}
</style></head><body>
<div id="hud"></div><canvas id="c"></canvas>
<p><small>Arrows/WASD move · Space wait · Enter = end loop (your run becomes a ghost, max 3) · Backspace = restart level · N = next level (after winning)</small></p>
<script src="core.js"></script>
<script>
const EV=window.EchoVault, C=document.getElementById('c'), X=C.getContext('2d'), T=48;
let g, best={};
function load(i){g=EV.newGame(i);C.width=g.level.w*T;C.height=g.level.h*T;draw();}
const KEYS={ArrowUp:'U',w:'U',ArrowDown:'D',s:'D',ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',' ':'W'};
addEventListener('keydown',e=>{
  const k=KEYS[e.key];
  if(k){EV.step(g,k);e.preventDefault();}
  else if(e.key==='Enter')EV.endLoop(g);
  else if(e.key==='Backspace'){EV.resetLevel(g);e.preventDefault();}
  else if((e.key==='n'||e.key==='N')&&g.won)load((g.levelIndex+1)%EV.LEVELS.length);
  draw();
});
function circle(p,col,r){X.fillStyle=col;X.beginPath();X.arc(p[0]*T+T/2,p[1]*T+T/2,r,0,7);X.fill();}
function draw(){
  const L=g.level,open=EV.doorsOpen(g);
  X.clearRect(0,0,C.width,C.height);
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
    const t=L.tiles[y][x];
    X.fillStyle=t==='#'?'#3a3f55':t==='D'?(open?'#2a4a3a':'#a5543f'):t==='P'?'#3b5b8c':t==='E'?'#c9a93c':'#232838';
    X.fillRect(x*T+1,y*T+1,T-2,T-2);
  }
  g.ghosts.forEach(gh=>circle(gh.pos,'rgba(140,200,255,.55)',T/3));
  circle(g.player,'#ffd',T/3+2);
  document.getElementById('hud').textContent=
    `Level ${g.levelIndex+1}: ${EV.LEVELS[g.levelIndex].name} · Loop ${g.loop} · Tick ${g.tick} · Ghosts ${g.ghosts.length}/${EV.MAX_GHOSTS}`+
    (g.won?` · SOLVED in ${g.loop} loop(s)! Press N`:'');
}
load(0);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ink Territory</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111417;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #hud {
    display: flex;
    gap: 32px;
    align-items: center;
    padding: 10px 0;
    font-size: 18px;
  }
  #hud .p1 { color: #4da6ff; }
  #hud .p2 { color: #ff9f43; }
  #hud .timer { color: #fff; font-weight: bold; }
  #wrap {
    position: relative;
  }
  canvas {
    background: #1b1f24;
    display: block;
    border: 2px solid #333;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.72);
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0 0 8px 0; font-size: 32px; }
  #overlay p { margin: 4px 0; font-size: 16px; color: #ccc; }
  #help {
    max-width: 720px;
    font-size: 13px;
    color: #999;
    margin: 10px 0 20px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="hud">
    <span class="p1">P1 (WASD): <span id="p1score">0</span></span>
    <span class="timer" id="timer">60</span>
    <span class="p2">P2 (Arrows): <span id="p2score">0</span></span>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1 id="resultTitle">Game Over</h1>
      <p id="resultDetail"></p>
      <p>Press R to restart</p>
    </div>
  </div>
  <p id="help">Claim territory by leaving your owned tiles, tracing a path, and
    returning home to seal it. Running into ANY wet trail — including your own —
    kills you and clears your unclaimed trail. Most tiles owned when the timer
    hits 0 wins.</p>

<script>
(function () {
  "use strict";

  // ---- Tunable constants ----
  const GRID_W = 30, GRID_H = 20;
  const CELL_PX = 24;
  const TICK_MS = 130;
  const ROUND_SECONDS = 60;
  const RESPAWN_MS = 1500;
  const START_BLOCK = 3;

  const COLORS = {
    0: null,
    1: { owner: "#2f6fb3", wet: "#3f8fd6" },
    2: { owner: "#b3701f", wet: "#e0902a" }
  };

  const canvas = document.getElementById("c");
  canvas.width = GRID_W * CELL_PX;
  canvas.height = GRID_H * CELL_PX;
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const resultTitle = document.getElementById("resultTitle");
  const resultDetail = document.getElementById("resultDetail");
  const p1scoreEl = document.getElementById("p1score");
  const p2scoreEl = document.getElementById("p2score");
  const timerEl = document.getElementById("timer");

  const DIRS = {
    up: { dx: 0, dy: -1 },
    down: { dx: 0, dy: 1 },
    left: { dx: -1, dy: 0 },
    right: { dx: 1, dy: 0 }
  };
  function opposite(d) {
    return { up: "down", down: "up", left: "right", right: "left" }[d];
  }

  let grid, players, timeRemaining, gameOver, winner, lastTickAt, paused;

  function makeGrid() {
    const g = [];
    for (let y = 0; y < GRID_H; y++) {
      const row = [];
      for (let x = 0; x < GRID_W; x++) row.push({ owner: 0, wet: 0 });
      g.push(row);
    }
    return g;
  }

  function stampStartBlock(g, cx, cy, owner) {
    const half = Math.floor(START_BLOCK / 2);
    for (let y = cy - half; y <= cy + half; y++) {
      for (let x = cx - half; x <= cx + half; x++) {
        if (x >= 0 && x < GRID_W && y >= 0 && y < GRID_H) g[y][x].owner = owner;
      }
    }
  }

  function makePlayer(id, x, y, dir) {
    return {
      id, x, y, dir, pendingDir: dir,
      trail: [],
      alive: true,
      respawnAt: 0,
      deaths: 0
    };
  }

  function territoryCentroid(owner) {
    let sx = 0, sy = 0, n = 0;
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (grid[y][x].owner === owner) { sx += x; sy += y; n++; }
      }
    }
    if (n === 0) return null;
    return { x: Math.round(sx / n), y: Math.round(sy / n) };
  }

  function resetGame() {
    grid = makeGrid();
    const p1Start = { x: 2, y: 2 };
    const p2Start = { x: GRID_W - 3, y: GRID_H - 3 };
    stampStartBlock(grid, p1Start.x, p1Start.y, 1);
    stampStartBlock(grid, p2Start.x, p2Start.y, 2);
    players = [
      makePlayer(1, p1Start.x, p1Start.y, "right"),
      makePlayer(2, p2Start.x, p2Start.y, "left")
    ];
    timeRemaining = ROUND_SECONDS;
    gameOver = false;
    winner = null;
    lastTickAt = 0;
    paused = false;
    overlay.classList.remove("show");
  }

  function killPlayer(p) {
    p.alive = false;
    p.deaths++;
    for (const cell of p.trail) {
      grid[cell.y][cell.x].wet = 0;
    }
    p.trail = [];
    p.respawnAt = performance.now() + RESPAWN_MS;
  }

  function respawnIfDue(p, now) {
    if (p.alive || now < p.respawnAt) return;
    const c = territoryCentroid(p.id) || (p.id === 1 ? { x: 2, y: 2 } : { x: GRID_W - 3, y: GRID_H - 3 });
    p.x = c.x;
    p.y = c.y;
    p.alive = true;
    p.dir = p.id === 1 ? "right" : "left";
    p.pendingDir = p.dir;
    p.trail = [];
  }

  function sealTrail(p) {
    for (const cell of p.trail) {
      grid[cell.y][cell.x].owner = p.id;
      grid[cell.y][cell.x].wet = 0;
    }
    p.trail = [];
  }

  function tick() {
    if (gameOver) return;
    const now = performance.now();

    for (const p of players) respawnIfDue(p, now);

    const moves = [];
    for (const p of players) {
      if (!p.alive) { moves.push(null); continue; }

      if (p.pendingDir !== p.dir) {
        const isReverse = opposite(p.pendingDir) === p.dir;
        if (!(isReverse && p.trail.length > 0)) {
          p.dir = p.pendingDir;
        }
      }

      const d = DIRS[p.dir];
      const nx = p.x + d.dx, ny = p.y + d.dy;
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) {
        moves.push(null); // blocked by wall, stays in place
        continue;
      }
      moves.push({ x: nx, y: ny });
    }

    // Apply moves
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const m = moves[i];
      if (!p.alive || !m) continue;

      const cell = grid[m.y][m.x];
      if (cell.owner === p.id) {
        p.x = m.x; p.y = m.y;
        if (p.trail.length > 0) sealTrail(p);
      } else if (cell.wet !== 0) {
        p.x = m.x; p.y = m.y;
        killPlayer(p);
      } else {
        p.x = m.x; p.y = m.y;
        cell.wet = p.id;
        p.trail.push({ x: m.x, y: m.y });
      }
    }

    // Head-on collision
    const alive = players.filter(p => p.alive);
    if (alive.length === 2 && alive[0].x === alive[1].x && alive[0].y === alive[1].y) {
      killPlayer(alive[0]);
      killPlayer(alive[1]);
    }
  }

  function tallyScores() {
    let s1 = 0, s2 = 0;
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (grid[y][x].owner === 1) s1++;
        else if (grid[y][x].owner === 2) s2++;
      }
    }
    return { s1, s2 };
  }

  function endGame() {
    gameOver = true;
    const { s1, s2 } = tallyScores();
    if (s1 > s2) winner = 1;
    else if (s2 > s1) winner = 2;
    else winner = 0;

    if (winner === 0) {
      resultTitle.textContent = "Draw!";
      resultTitle.style.color = "#fff";
    } else {
      resultTitle.textContent = `Player ${winner} Wins!`;
      resultTitle.style.color = winner === 1 ? "#4da6ff" : "#ff9f43";
    }
    resultDetail.textContent = `P1: ${s1} tiles  —  P2: ${s2} tiles`;
    overlay.classList.add("show");
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const cell = grid[y][x];
        let color = null;
        if (cell.wet !== 0) color = COLORS[cell.wet].wet;
        else if (cell.owner !== 0) color = COLORS[cell.owner].owner;
        if (color) {
          ctx.fillStyle = color;
          ctx.fillRect(x * CELL_PX, y * CELL_PX, CELL_PX - 1, CELL_PX - 1);
        }
      }
    }
    for (const p of players) {
      if (!p.alive) continue;
      ctx.fillStyle = p.id === 1 ? "#dff1ff" : "#ffe6cc";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      const px = p.x * CELL_PX, py = p.y * CELL_PX;
      ctx.fillRect(px + 2, py + 2, CELL_PX - 5, CELL_PX - 5);
      ctx.strokeRect(px + 2, py + 2, CELL_PX - 5, CELL_PX - 5);
    }

    const { s1, s2 } = tallyScores();
    p1scoreEl.textContent = s1;
    p2scoreEl.textContent = s2;
    timerEl.textContent = Math.max(0, Math.ceil(timeRemaining));
  }

  let rafLastTime = null;
  function frame(now) {
    if (rafLastTime === null) rafLastTime = now;
    const dt = (now - rafLastTime) / 1000;
    rafLastTime = now;

    if (!gameOver && !paused) {
      timeRemaining -= dt;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        render();
        endGame();
        requestAnimationFrame(frame);
        return;
      }
      if (now - lastTickAt >= TICK_MS) {
        lastTickAt = now;
        tick();
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  const keyMap = {
    "w": ["p1", "up"], "a": ["p1", "left"], "s": ["p1", "down"], "d": ["p1", "right"],
    "arrowup": ["p2", "up"], "arrowleft": ["p2", "left"],
    "arrowdown": ["p2", "down"], "arrowright": ["p2", "right"]
  };

  window.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if (key === "r") { resetGame(); return; }
    const mapped = keyMap[key];
    if (!mapped) return;
    e.preventDefault();
    const [who, dir] = mapped;
    const p = who === "p1" ? players[0] : players[1];
    p.pendingDir = dir;
  });

  // ---- Debug/test hooks ----
  window.__inkTerritory = {
    get grid() { return grid; },
    get players() { return players; },
    get gameOver() { return gameOver; },
    get winner() { return winner; },
    get timeRemaining() { return timeRemaining; },
    get paused() { return paused; },
    setPaused(v) { paused = !!v; },
    setTimeRemaining(seconds) { timeRemaining = seconds; },
    tick() { tick(); render(); },
    reset() { resetGame(); render(); },
    tallyScores
  };

  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

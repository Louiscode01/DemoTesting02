<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Duel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060a;
    color: #e8ecf4;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    height: 100%;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    background: #05060a;
    border: 1px solid #2a3040;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.15);
  }
  #hint {
    margin-top: 8px;
    font-size: 12px;
    color: #8b93a7;
    text-align: center;
    max-width: 900px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="hint">
    1: 2-player local &nbsp;|&nbsp; 2: vs Rival AI &nbsp;|&nbsp;
    Player 1: A/D rotate, W thrust, Space fire &nbsp;|&nbsp;
    Player 2: Left/Right rotate, Up thrust, Enter fire (2-player mode) &nbsp;|&nbsp;
    R to restart after a win, M for menu. First to 5 kills wins. Watch the star's gravity — it bends ships and bullets alike.
  </div>
</div>
<script>
(function () {
  'use strict';

  // ---------- Tunable constants ----------
  const G = 22000;
  const STAR_MASS = 1;
  const STAR_RADIUS = 18;
  const GRAV_MIN_R = 40;          // clamp to avoid singularity blow-up near the star
  const SHIP_RADIUS = 10;
  const SHIP_THRUST = 260;
  const SHIP_ROT_SPEED = 3.6;     // radians / sec
  const SHIP_DRAG = 0.15;         // linear damping factor per second
  const BULLET_SPEED = 340;
  const BULLET_TTL = 3.2;         // seconds
  const FIRE_COOLDOWN = 0.28;     // seconds
  const WIN_SCORE = 5;
  const RESPAWN_DELAY = 1.0;      // seconds

  const MODE_LOCAL = 'local';
  const MODE_AI = 'ai';

  // --- AI pilot ---
  // Aiming
  const AI_AIM_SAMPLES = 9;          // candidate firing angles per search
  const AI_AIM_SPREAD = 0.9;         // radians, half-width of the candidate fan around direct bearing
  const AI_SIM_STEPS = 45;           // forward-simulation horizon in steps
  const AI_SIM_DT = 1 / 30;          // fixed prediction timestep (frame-rate independent AI)
  const AI_AIM_TOLERANCE = 18;       // px; min predicted miss distance that counts as a solution
  const AI_FIRE_ANGLE_TOL = 0.10;    // radians; facing error allowed when pulling the trigger
  const AI_AIM_DEADZONE = 0.03;      // radians; stop rotating inside this, prevents oscillation
  const AI_RETARGET_INTERVAL = 0.10; // seconds between full aim searches
  let AI_AIM_JITTER = 0.035;         // radians of random aim error; primary difficulty knob
                                      // (mutable, not const: test hook can zero it for determinism)
  // Movement
  const AI_DANGER_RADIUS = 90;       // px from star center that triggers the escape burn
  const AI_ESCAPE_LOOKAHEAD = 0.6;   // seconds of extrapolation for the danger check
  const AI_RANGE_MIN = 140;          // px; closer than this, back off
  const AI_RANGE_MAX = 340;          // px; farther than this, close in
  const AI_ORBIT_BIAS = 0.5;         // radians of tangential bias applied while repositioning
  const AI_THRUST_ALIGN_TOL = 0.5;   // radians; only thrust when roughly facing the desired heading

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CENTER = { x: W / 2, y: H / 2 };

  // ---------- Vector helpers ----------
  const v = {
    add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
    sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
    scale: (a, s) => ({ x: a.x * s, y: a.y * s }),
    len: (a) => Math.hypot(a.x, a.y),
    norm: (a) => {
      const l = Math.hypot(a.x, a.y) || 1;
      return { x: a.x / l, y: a.y / l };
    }
  };

  function shortestSignedAngleDelta(from, to) {
    let d = (to - from) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // ---------- Starfield (static, seeded) ----------
  function seededRandom(seed) {
    let s = seed;
    return function () {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }
  const rand = seededRandom(1337);
  const stars = [];
  for (let i = 0; i < 140; i++) {
    stars.push({
      x: rand() * W,
      y: rand() * H,
      r: rand() * 1.4 + 0.3,
      a: rand() * 0.6 + 0.3
    });
  }

  // ---------- Entities ----------
  function makeShip(id, color, spawn, angle, keys) {
    return {
      id, color, keys,
      pos: { ...spawn },
      vel: { x: 0, y: 0 },
      angle,
      alive: true,
      respawnAt: 0,
      cooldown: 0,
      thrusting: false,
      score: 0,
      isAI: false,
      ai: null
    };
  }

  function resetAIState(ship) {
    ship.ai = {
      aimAngle: ship.angle,
      hasSolution: false,
      retargetAt: 0,
      ticks: 0,
      fires: 0,
      rotateTicks: 0,
      thrustTicks: 0
    };
  }

  const SPAWN_P1 = { x: W * 0.22, y: H * 0.5 };
  const SPAWN_P2 = { x: W * 0.78, y: H * 0.5 };

  const players = [
    makeShip('P1', '#4ec9ff', SPAWN_P1, 0, {
      left: 'KeyA', right: 'KeyD', thrust: 'KeyW', fire: 'Space'
    }),
    makeShip('P2', '#ff5d73', SPAWN_P2, Math.PI, {
      left: 'ArrowLeft', right: 'ArrowRight', thrust: 'ArrowUp', fire: 'Enter'
    })
  ];

  let bullets = [];
  let particles = [];
  let phase = 'menu';   // 'menu' | 'playing' | 'gameover'
  let mode = null;      // 'local' | 'ai'
  let winner = null;

  // ---------- Input ----------
  const keysDown = new Set();
  window.addEventListener('keydown', (e) => {
    keysDown.add(e.code);
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
      e.preventDefault();
    }
    if (phase === 'menu') {
      if (e.code === 'Digit1') startGame(MODE_LOCAL);
      else if (e.code === 'Digit2') startGame(MODE_AI);
    } else if (phase === 'gameover') {
      if (e.code === 'KeyR') startGame(mode);
      else if (e.code === 'KeyM') phase = 'menu';
    }
  }, { passive: false });
  window.addEventListener('keyup', (e) => keysDown.delete(e.code));

  function startGame(m) {
    players[0].pos = { ...SPAWN_P1 };
    players[0].vel = { x: 0, y: 0 };
    players[0].angle = 0;
    players[0].alive = true;
    players[0].score = 0;
    players[0].isAI = false;

    players[1].pos = { ...SPAWN_P2 };
    players[1].vel = { x: 0, y: 0 };
    players[1].angle = Math.PI;
    players[1].alive = true;
    players[1].score = 0;
    players[1].isAI = (m === MODE_AI);
    resetAIState(players[1]);

    bullets = [];
    particles = [];
    winner = null;
    mode = m;
    phase = 'playing';
  }

  // ---------- Physics ----------
  function gravityAccel(pos) {
    const toStar = v.sub(CENTER, pos);
    const r = Math.max(v.len(toStar), GRAV_MIN_R);
    const dir = v.norm(toStar);
    const mag = (G * STAR_MASS) / (r * r);
    return v.scale(dir, mag);
  }

  function wrap(pos) {
    if (pos.x < 0) pos.x += W;
    if (pos.x > W) pos.x -= W;
    if (pos.y < 0) pos.y += H;
    if (pos.y > H) pos.y -= H;
  }

  function spawnExplosion(pos, color) {
    for (let i = 0; i < 18; i++) {
      const ang = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 120;
      particles.push({
        pos: { ...pos },
        vel: { x: Math.cos(ang) * speed, y: Math.sin(ang) * speed },
        life: 0.5 + Math.random() * 0.4,
        color
      });
    }
  }

  function respawnShip(ship, now) {
    ship.pos = { ...(ship.id === 'P1' ? SPAWN_P1 : SPAWN_P2) };
    ship.vel = { x: 0, y: 0 };
    ship.angle = ship.id === 'P1' ? 0 : Math.PI;
    ship.alive = true;
  }

  function registerKill(shooterId, victim, now) {
    spawnExplosion(victim.pos, victim.color);
    victim.alive = false;
    victim.respawnAt = now + RESPAWN_DELAY;
    const shooter = players.find(p => p.id === shooterId);
    if (shooter) {
      shooter.score += 1;
      if (shooter.score >= WIN_SCORE) {
        phase = 'gameover';
        winner = shooter.id;
      }
    }
  }

  // ---------- AI pilot ----------
  // Forward-simulates a candidate shot fired *now* at `angle` through the same
  // gravity well the real sim uses, tracking the minimum bullet-to-target distance
  // reached. The target is assumed non-thrusting (gravity + drag only) since the AI
  // cannot know the opponent's future input. Returns that minimum distance.
  function simulateShot(ship, target, angle) {
    const dir = { x: Math.cos(angle), y: Math.sin(angle) };
    let bPos = v.add(ship.pos, v.scale(dir, SHIP_RADIUS + 4));
    let bVel = v.add(ship.vel, v.scale(dir, BULLET_SPEED));
    let tPos = { ...target.pos };
    let tVel = { ...target.vel };
    let minDist = v.len(v.sub(bPos, tPos));

    for (let s = 0; s < AI_SIM_STEPS; s++) {
      bVel = v.add(bVel, v.scale(gravityAccel(bPos), AI_SIM_DT));
      bPos = v.add(bPos, v.scale(bVel, AI_SIM_DT));

      tVel = v.add(tVel, v.scale(gravityAccel(tPos), AI_SIM_DT));
      tVel = v.scale(tVel, Math.max(0, 1 - SHIP_DRAG * AI_SIM_DT));
      tPos = v.add(tPos, v.scale(tVel, AI_SIM_DT));

      const dist = v.len(v.sub(bPos, tPos));
      if (dist < minDist) minDist = dist;

      // Real bullets are absorbed by the star or eventually wrap; prediction
      // doesn't model wrap (documented limitation), so treat leaving the arena
      // or entering the star as "this candidate is spent" and stop early.
      if (v.len(v.sub(bPos, CENTER)) < STAR_RADIUS) break;
      if (bPos.x < 0 || bPos.x > W || bPos.y < 0 || bPos.y > H) break;
    }
    return minDist;
  }

  // Samples a fan of candidate firing angles around the direct bearing to the
  // target, scores each by simulateShot(), and returns the best if it clears
  // AI_AIM_TOLERANCE, else null (no solution yet -- AI should hold fire).
  function findAimSolution(ship, target) {
    const toTarget = v.sub(target.pos, ship.pos);
    const bearing = Math.atan2(toTarget.y, toTarget.x);
    let best = null;
    for (let i = 0; i < AI_AIM_SAMPLES; i++) {
      const t = AI_AIM_SAMPLES === 1 ? 0 : (i / (AI_AIM_SAMPLES - 1)) * 2 - 1; // -1..1
      const angle = bearing + t * AI_AIM_SPREAD;
      const minDist = simulateShot(ship, target, angle);
      if (best === null || minDist < best.minDist) best = { angle, minDist };
    }
    return (best && best.minDist < AI_AIM_TOLERANCE) ? best : null;
  }

  // Runs once per tick. Never writes ship.vel/pos/bullets directly -- returns the
  // same {left, right, thrust, fire} control surface a human produces, so the AI
  // is physically incapable of doing anything a human player couldn't.
  function aiDecide(ship, target, now) {
    if (!ship.ai) resetAIState(ship);
    const ai = ship.ai;
    ai.ticks++;

    let desiredAngle;
    let wantThrust = false;

    const distCenter = v.len(v.sub(CENTER, ship.pos));
    const lookaheadPos = v.add(ship.pos, v.scale(ship.vel, AI_ESCAPE_LOOKAHEAD));
    const distCenterLookahead = v.len(v.sub(CENTER, lookaheadPos));

    if (distCenter < AI_DANGER_RADIUS || distCenterLookahead < AI_DANGER_RADIUS) {
      // 1. Escape star (highest priority) -- the only hard safety behavior.
      const away = v.norm(v.sub(ship.pos, CENTER));
      desiredAngle = Math.atan2(away.y, away.x);
      wantThrust = true;
    } else {
      const toTarget = v.sub(target.pos, ship.pos);
      const distTarget = v.len(toTarget);
      if (distTarget < AI_RANGE_MIN || distTarget > AI_RANGE_MAX) {
        // 2. Reposition -- arc around the well (tangential bias) rather than
        // plough straight through it.
        const bearing = Math.atan2(toTarget.y, toTarget.x);
        const towardOrAway = distTarget < AI_RANGE_MIN ? bearing + Math.PI : bearing;
        desiredAngle = towardOrAway + AI_ORBIT_BIAS;
        wantThrust = true;
      } else {
        // 3. Engage -- coast and shoot.
        if (now >= ai.retargetAt) {
          ai.retargetAt = now + AI_RETARGET_INTERVAL;
          const solution = findAimSolution(ship, target);
          if (solution) {
            ai.aimAngle = solution.angle + (Math.random() * 2 - 1) * AI_AIM_JITTER;
            ai.hasSolution = true;
          } else {
            ai.hasSolution = false;
          }
        }
        desiredAngle = ai.aimAngle;
        wantThrust = false;
      }
    }

    const d = shortestSignedAngleDelta(ship.angle, desiredAngle);
    const left = d < -AI_AIM_DEADZONE;
    const right = d > AI_AIM_DEADZONE;
    const thrust = wantThrust && Math.abs(d) < AI_THRUST_ALIGN_TOL;
    const fire = ai.hasSolution &&
      Math.abs(shortestSignedAngleDelta(ship.angle, ai.aimAngle)) < AI_FIRE_ANGLE_TOL;

    if (left || right) ai.rotateTicks++;
    if (thrust) ai.thrustTicks++;
    if (fire) ai.fires++;

    return { left, right, thrust, fire };
  }

  // Human ships read keysDown; AI ships get their control surface from aiDecide().
  // Either way step() consumes the same {left, right, thrust, fire} shape.
  function readIntent(ship, now) {
    if (ship.isAI) {
      const target = players.find(p => p.id !== ship.id);
      return aiDecide(ship, target, now);
    }
    const k = ship.keys;
    return {
      left: keysDown.has(k.left),
      right: keysDown.has(k.right),
      thrust: keysDown.has(k.thrust),
      fire: keysDown.has(k.fire)
    };
  }

  function step(dt, now) {
    if (phase !== 'playing') return;

    for (const ship of players) {
      if (!ship.alive) {
        if (now >= ship.respawnAt) respawnShip(ship, now);
        continue;
      }

      const intent = readIntent(ship, now);

      if (intent.left) ship.angle -= SHIP_ROT_SPEED * dt;
      if (intent.right) ship.angle += SHIP_ROT_SPEED * dt;

      ship.thrusting = intent.thrust;
      if (ship.thrusting) {
        const thrustVec = { x: Math.cos(ship.angle), y: Math.sin(ship.angle) };
        ship.vel = v.add(ship.vel, v.scale(thrustVec, SHIP_THRUST * dt));
      }

      // gravity
      ship.vel = v.add(ship.vel, v.scale(gravityAccel(ship.pos), dt));
      // drag
      ship.vel = v.scale(ship.vel, Math.max(0, 1 - SHIP_DRAG * dt));
      // integrate
      ship.pos = v.add(ship.pos, v.scale(ship.vel, dt));
      wrap(ship.pos);

      // star collision
      if (v.len(v.sub(ship.pos, CENTER)) < STAR_RADIUS + SHIP_RADIUS) {
        spawnExplosion(ship.pos, ship.color);
        ship.alive = false;
        ship.respawnAt = now + RESPAWN_DELAY;
        continue;
      }

      // firing
      ship.cooldown -= dt;
      if (intent.fire && ship.cooldown <= 0) {
        ship.cooldown = FIRE_COOLDOWN;
        const dir = { x: Math.cos(ship.angle), y: Math.sin(ship.angle) };
        bullets.push({
          pos: v.add(ship.pos, v.scale(dir, SHIP_RADIUS + 4)),
          vel: v.add(ship.vel, v.scale(dir, BULLET_SPEED)),
          ttl: BULLET_TTL,
          owner: ship.id,
          color: ship.color
        });
      }
    }

    // bullets
    for (const b of bullets) {
      b.vel = v.add(b.vel, v.scale(gravityAccel(b.pos), dt));
      b.pos = v.add(b.pos, v.scale(b.vel, dt));
      wrap(b.pos);
      b.ttl -= dt;

      if (v.len(v.sub(b.pos, CENTER)) < STAR_RADIUS) {
        b.ttl = 0; // absorbed by star
      }
    }

    // bullet-ship collisions
    for (const b of bullets) {
      if (b.ttl <= 0) continue;
      for (const ship of players) {
        if (!ship.alive || ship.id === b.owner) continue;
        if (v.len(v.sub(b.pos, ship.pos)) < SHIP_RADIUS + 2) {
          b.ttl = 0;
          registerKill(b.owner, ship, now);
        }
      }
    }
    bullets = bullets.filter(b => b.ttl > 0);

    // particles
    for (const p of particles) {
      p.pos = v.add(p.pos, v.scale(p.vel, dt));
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Render ----------
  function drawStarfield() {
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStar() {
    const grad = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, STAR_RADIUS * 4);
    grad.addColorStop(0, 'rgba(255, 220, 140, 0.9)');
    grad.addColorStop(0.3, 'rgba(255, 180, 80, 0.35)');
    grad.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, STAR_RADIUS * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffdc8c';
    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, STAR_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShip(ship) {
    if (!ship.alive) return;
    ctx.save();
    ctx.translate(ship.pos.x, ship.pos.y);
    ctx.rotate(ship.angle);

    if (ship.thrusting) {
      ctx.fillStyle = 'rgba(255,150,60,0.9)';
      ctx.beginPath();
      ctx.moveTo(-SHIP_RADIUS, 0);
      ctx.lineTo(-SHIP_RADIUS - 10 - Math.random() * 6, 0);
      ctx.lineTo(-SHIP_RADIUS, 5);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = ship.color;
    ctx.beginPath();
    ctx.moveTo(SHIP_RADIUS, 0);
    ctx.lineTo(-SHIP_RADIUS * 0.8, SHIP_RADIUS * 0.7);
    ctx.lineTo(-SHIP_RADIUS * 0.4, 0);
    ctx.lineTo(-SHIP_RADIUS * 0.8, -SHIP_RADIUS * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.pos.x, b.pos.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.pos.x, p.pos.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8ecf4';
    ctx.font = '42px "Courier New", monospace';
    ctx.fillText('ORBIT DUEL', W / 2, H / 2 - 60);
    ctx.font = '20px "Courier New", monospace';
    ctx.fillText('1 — 2 Players (local)', W / 2, H / 2 - 10);
    ctx.fillText('2 — vs Rival AI', W / 2, H / 2 + 20);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#8b93a7';
    ctx.fillText('P1: A/D rotate, W thrust, Space fire', W / 2, H / 2 + 60);
    ctx.fillText('P2: Left/Right rotate, Up thrust, Enter fire (2-player mode)', W / 2, H / 2 + 82);
    ctx.textAlign = 'left';
  }

  function drawHUD() {
    const p2Label = mode === MODE_AI ? 'AI' : 'P2';

    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = players[0].color;
    ctx.fillText('P1: ' + players[0].score, 20, 30);
    ctx.fillStyle = players[1].color;
    ctx.textAlign = 'right';
    ctx.fillText(p2Label + ': ' + players[1].score, W - 20, 30);
    ctx.textAlign = 'left';

    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      const winnerLabel = winner === 'P1' ? 'P1' : p2Label;
      ctx.fillStyle = winner === 'P1' ? players[0].color : players[1].color;
      ctx.font = '42px "Courier New", monospace';
      ctx.fillText(winnerLabel + ' WINS', W / 2, H / 2 - 10);
      ctx.fillStyle = '#e8ecf4';
      ctx.font = '18px "Courier New", monospace';
      ctx.fillText('Press R to restart', W / 2, H / 2 + 26);
      ctx.font = '14px "Courier New", monospace';
      ctx.fillStyle = '#8b93a7';
      ctx.fillText('Press M for menu', W / 2, H / 2 + 50);
      ctx.textAlign = 'left';
    }
  }

  function render() {
    drawStarfield();
    drawStar();
    drawBullets();
    drawParticles();
    for (const ship of players) drawShip(ship);
    drawHUD();
    if (phase === 'menu') drawMenu();
  }

  // ---------- Main loop ----------
  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 1 / 30); // clamp to avoid spiral of death
    lastTime = now;
    step(dt, now / 1000);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Expose minimal hooks for automated testing.
  // NOTE: `bullets`/`phase`/`mode`/`winner` are reassigned over time (filter/state
  // machine), so these must be live getters, not object-literal snapshots of the
  // initial value, or the exposed reference goes stale after the first frame.
  window.__orbitDuel = {
    players,
    get bullets() { return bullets; },
    get phase() { return phase; },
    get mode() { return mode; },
    get winner() { return winner; },
    get gameOver() { return phase === 'gameover'; }, // derived, back-compat with Cycle 1 checks
    startGame,
    // Routes through the SAME registerKill() the real bullet-collision path calls,
    // so a test exercises the actual win transition/overlay/respawn wiring rather
    // than flipping state flags directly.
    awardKill(id) {
      const victim = players.find(p => p.id !== id);
      if (victim) registerKill(id, victim, performance.now() / 1000);
    },
    get aiDebug() { return players[1].ai; },
    setAimJitter(n) { AI_AIM_JITTER = n; }
  };
})();
</script>

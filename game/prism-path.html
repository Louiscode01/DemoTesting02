<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Path</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e17;color:#dfe6f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #hud{display:flex;gap:24px;font-size:16px}
  canvas{background:#10152a;border-radius:8px;max-width:96vw;touch-action:manipulation;cursor:pointer}
  #help{font-size:13px;opacity:.7}
</style></head>
<body>
<div id="hud"><span id="lvl"></span><span id="mv"></span></div>
<canvas id="c"></canvas>
<div id="help">Click a mirror to flip it (/ &harr; \). Guide the beam to the target. R = reshuffle, N = next level (after win).</div>
<script>
// ---- constants ----
const CELL = 64;
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]]; // right, down, left, up
const E = 0, WALL = 1, SRC = 2, TGT = 3, MIR = 4;

// ---- rng ----
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

// ---- pure logic ----
function reflect(m, d){ // m: 0 '/', 1 '\'
  const [dx,dy]=DIRS[d]; const [nx,ny]= m===0 ? [-dy,-dx] : [dy,dx];
  return DIRS.findIndex(v=>v[0]===nx&&v[1]===ny);
}
function trace(g){
  const segs=[]; let x=g.src.x,y=g.src.y,d=g.src.d,lit=false;
  const seen=new Set();
  for(;;){
    const nx=x+DIRS[d][0], ny=y+DIRS[d][1];
    if(nx<0||ny<0||nx>=g.w||ny>=g.h){segs.push([x,y,nx,ny]);break;}
    const c=g.cells[ny][nx];
    if(c.t===WALL){segs.push([x,y,x+DIRS[d][0]*.5,y+DIRS[d][1]*.5]);break;}
    segs.push([x,y,nx,ny]);
    if(c.t===TGT){lit=true;break;}
    x=nx;y=ny;
    if(c.t===MIR) d=reflect(c.m,d);
    const k=x+','+y+','+d; if(seen.has(k))break; seen.add(k);
  }
  return {segs,lit};
}
function generate(seed, level){
  const R=rng(seed*7919+level);
  const w=Math.min(6+Math.floor(level/2),12), h=Math.min(5+Math.floor(level/2),9);
  const turns=Math.min(2+level,10);
  for(let attempt=0;attempt<500;attempt++){
    const cells=Array.from({length:h},()=>Array.from({length:w},()=>({t:E})));
    const occ=new Set(); const key=(x,y)=>x+','+y;
    const free=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&!occ.has(key(x,y));
    const sy=Math.floor(R()*h); let x=0,y=sy,d=0; occ.add(key(x,y));
    const src={x,y,d:0}; const sol=[]; let ok=true;
    for(let i=0;i<turns&&ok;i++){
      const len=1+Math.floor(R()*4); let moved=0;
      while(moved<len&&free(x+DIRS[d][0],y+DIRS[d][1])){x+=DIRS[d][0];y+=DIRS[d][1];occ.add(key(x,y));moved++;}
      if(!moved){ok=false;break;}
      const ms=R()<.5?[0,1]:[1,0]; let placed=false;
      for(const m of ms){const nd=reflect(m,d); if(free(x+DIRS[nd][0],y+DIRS[nd][1])){sol.push({x,y,m});d=nd;placed=true;break;}}
      if(!placed)ok=false;
    }
    if(!ok)continue;
    let moved=0; while(moved<6&&free(x+DIRS[d][0],y+DIRS[d][1])){x+=DIRS[d][0];y+=DIRS[d][1];occ.add(key(x,y));moved++;}
    if(!moved)continue;
    cells[y][x]={t:TGT}; cells[src.y][src.x]={t:SRC};
    for(const s of sol)cells[s.y][s.x]={t:MIR,m:s.m};
    const solution=sol.map(s=>({...s}));
    // decoys & walls on free cells
    const empties=[]; for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!occ.has(key(i,j)))empties.push([i,j]);
    for(let i=empties.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[empties[i],empties[j]]=[empties[j],empties[i]];}
    const nDecoy=Math.min(level*2,empties.length), nWall=Math.min(level,empties.length-nDecoy);
    for(let i=0;i<nDecoy;i++){const[a,b]=empties[i];cells[b][a]={t:MIR,m:R()<.5?0:1,decoy:true};}
    for(let i=0;i<nWall;i++){const[a,b]=empties[nDecoy+i];cells[b][a]={t:WALL};}
    const g={w,h,cells,src,solution,level,seed};
    // scramble until unsolved
    for(let tries=0;tries<50;tries++){
      for(const s of sol)cells[s.y][s.x].m=R()<.5?0:1;
      if(!trace(g).lit)return g;
    }
  }
  throw new Error('generation failed');
}

// ---- game state ----
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let g,moves=0,won=false,level=1,seed=1;
function newLevel(s,l){seed=s;level=l;g=generate(seed,level);moves=0;won=false;resize();draw();}
function resize(){cv.width=g.w*CELL;cv.height=g.h*CELL;}
function flip(x,y){
  if(won)return false; const c=g.cells[y]?.[x]; if(!c||c.t!==MIR)return false;
  c.m^=1; moves++; won=trace(g).lit; draw(); return true;
}
function solve(){for(const s of g.solution)g.cells[s.y][s.x].m=s.m; won=trace(g).lit; draw();}

// ---- render ----
function draw(){
  const{w,h}=g; ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#1c2342';ctx.lineWidth=1;
  for(let i=0;i<=w;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,h*CELL);ctx.stroke();}
  for(let j=0;j<=h;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(w*CELL,j*CELL);ctx.stroke();}
  const tr=trace(g);
  ctx.save();ctx.lineCap='round';ctx.shadowColor='#ff4d6d';ctx.shadowBlur=14;ctx.strokeStyle='#ff9bb0';ctx.lineWidth=4;
  ctx.beginPath();for(const[a,b,c,d]of tr.segs){ctx.moveTo((a+.5)*CELL,(b+.5)*CELL);ctx.lineTo((c+.5)*CELL,(d+.5)*CELL);}ctx.stroke();ctx.restore();
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const c=g.cells[j][i],cx=(i+.5)*CELL,cy=(j+.5)*CELL;
    if(c.t===WALL){ctx.fillStyle='#2a3150';ctx.fillRect(i*CELL+4,j*CELL+4,CELL-8,CELL-8);}
    else if(c.t===SRC){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(cx,cy,14,0,7);ctx.fill();}
    else if(c.t===TGT){ctx.strokeStyle=tr.lit?'#7dffb0':'#5a7';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,16,0,7);ctx.stroke();
      if(tr.lit){ctx.fillStyle='#7dffb0';ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();}}
    else if(c.t===MIR){ctx.strokeStyle='#8fd3ff';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();
      const r=22; if(c.m===0){ctx.moveTo(cx-r,cy+r);ctx.lineTo(cx+r,cy-r);}else{ctx.moveTo(cx-r,cy-r);ctx.lineTo(cx+r,cy+r);}ctx.stroke();}
  }
  if(won){ctx.fillStyle='rgba(8,10,20,.72)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#7dffb0';ctx.font='bold 34px system-ui';ctx.textAlign='center';
    ctx.fillText('Solved in '+moves+' moves',cv.width/2,cv.height/2-8);ctx.font='18px system-ui';ctx.fillStyle='#dfe6f5';ctx.fillText('Press N or click for next level',cv.width/2,cv.height/2+24);}
  document.getElementById('lvl').textContent='Level '+level;document.getElementById('mv').textContent='Moves '+moves;
}

// ---- input ----
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),s=cv.width/r.width;
  const x=Math.floor((e.clientX-r.left)*s/CELL),y=Math.floor((e.clientY-r.top)*s/CELL);
  if(won){newLevel(seed,level+1);return;} flip(x,y);
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r')newLevel(seed+1,level); else if(k==='n'&&won)newLevel(seed,level+1);
});

// test hook
window.__prism={newLevel,flip,solve,trace:()=>trace(g),generate,
  get won(){return won},get moves(){return moves},get level(){return level},get grid(){return g}};
newLevel(1,1);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drift Maze</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10121a;
    color: #e8e8f0;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #hud {
    margin: 10px 0;
    text-align: center;
    line-height: 1.4;
  }
  #hud .title { font-size: 1.3em; font-weight: bold; }
  #hud .legend { font-size: 0.85em; opacity: 0.75; max-width: 640px; }
  canvas {
    background: #1a1d29;
    border: 2px solid #444a63;
    border-radius: 6px;
  }
  #banner {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10, 12, 20, 0.92);
    border: 2px solid #6ee7ff;
    border-radius: 10px;
    padding: 24px 36px;
    text-align: center;
    font-size: 1.4em;
    display: none;
  }
  #banner.show { display: block; }
  #banner .sub { font-size: 0.6em; opacity: 0.8; margin-top: 8px; }
</style>
</head>
<body>
  <div id="hud">
    <div class="title" id="levelTitle">Drift Maze</div>
    <div id="moveCount">Moves: 0</div>
    <div id="runInfo"></div>
    <div class="legend">
      Arrow keys / WASD: slide until something stops you. U: undo &middot; H: hint &middot; R: reset &middot;
      M: switch Campaign / Endless &middot; N: new endless run.<br>
      Brown = cracked wall (stops you once, then shatters) &middot; arrows = one-way gate &middot;
      numbers = teleport pads.
    </div>
  </div>
  <canvas id="canvas" width="640" height="560"></canvas>
  <div id="banner"></div>

  <script src="drift-maze-logic.js"></script>
  <script src="drift-maze-levels.js"></script>
  <script src="drift-maze-gen.js"></script>
  <script>
  (function () {
    'use strict';

    var MAX_TILE = 56, MAX_BOARD_W = 728;
    var TILE = MAX_TILE;
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var levelTitleEl = document.getElementById('levelTitle');
    var moveCountEl = document.getElementById('moveCount');
    var runInfoEl = document.getElementById('runInfo');
    var bannerEl = document.getElementById('banner');

    var TILE_COLORS = {
      '#': '#2c3040',
      '.': '#1a1d29',
      'B': '#7a5230',
      'U': '#3a6b8a', 'D': '#3a6b8a', 'L': '#3a6b8a', 'R': '#3a6b8a',
      '1': '#8a3a8a', '2': '#8a3a8a',
      'E': '#2f8a4f',
    };

    var GATE_ARROW = { U: '↑', D: '↓', L: '←', R: '→' };

    var params = new URLSearchParams(window.location.search);

    var state = {
      mode: params.get('mode') === 'endless' ? 'endless' : 'campaign',
      levelIndex: 0,    // campaign: index into DRIFT_MAZE_LEVELS
      runSeed: (parseInt(params.get('seed'), 10) || Math.floor(Math.random() * 1e6)) >>> 0,
      depth: 1,         // endless: 1-based level number within the run
      runMoves: 0,      // endless: moves spent on completed levels this run
      runPar: 0,        // endless: par total of completed levels this run
      def: null,        // current level definition (campaign entry or generated)
      par: 0,
      level: null,
      pos: null,
      moves: 0,
      solved: false,
      history: [],      // undo stack of {pos, grid, moves}
      hint: null,       // direction currently highlighted by the hint, if any
      animPath: null,   // array of {x,y} cells being tweened through, in canvas px
      animStart: 0,
      animDuration: 0,
      pendingDir: null, // queued input received while an animation is in flight
      cleared: false,   // campaign: all levels finished
    };

    function startLevel(def, title) {
      var level = DriftMaze.parseLevel(def);
      state.def = def;
      state.level = level;
      // Par comes from the exact solver, never from hand-entered data.
      state.par = def.par || DriftMaze.solveLevel(level).length;
      state.pos = { x: level.start.x, y: level.start.y };
      state.moves = 0;
      state.solved = false;
      state.history = [];
      state.hint = null;
      state.animPath = null;
      state.pendingDir = null;
      TILE = Math.min(MAX_TILE, Math.floor(MAX_BOARD_W / level.width));
      canvas.width = level.width * TILE;
      canvas.height = level.height * TILE;
      levelTitleEl.textContent = title;
      updateHud();
      hideBanner();
      render();
    }

    function loadLevel(idx) {
      state.mode = 'campaign';
      state.levelIndex = idx;
      state.cleared = false;
      var def = DRIFT_MAZE_LEVELS[idx];
      startLevel(def, 'Campaign ' + (idx + 1) + ' / ' + DRIFT_MAZE_LEVELS.length + ' — ' + def.name);
    }

    function loadEndless(depth) {
      state.mode = 'endless';
      state.depth = depth;
      state.cleared = false;
      var def = DriftMazeGen.levelForRun(state.runSeed, depth);
      startLevel(def, 'Endless — depth ' + depth + ' — ' + def.tierName);
    }

    function startEndlessRun(seed) {
      state.runSeed = seed >>> 0;
      state.runMoves = 0;
      state.runPar = 0;
      loadEndless(1);
    }

    function reloadCurrent() {
      if (state.mode === 'endless') loadEndless(state.depth);
      else loadLevel(state.levelIndex);
    }

    function updateHud() {
      moveCountEl.textContent = 'Moves: ' + state.moves + ' (par ' + state.par + ')';
      if (state.mode === 'endless') {
        var over = state.runMoves - state.runPar;
        runInfoEl.textContent = 'Run seed ' + state.runSeed + ' · cleared ' + (state.depth - 1) +
          ' · ' + (over === 0 ? 'on par' : '+' + over + ' over par') +
          ' · replay with ?mode=endless&seed=' + state.runSeed;
      } else {
        runInfoEl.textContent = '';
      }
    }

    function showBanner(html) {
      bannerEl.innerHTML = html;
      bannerEl.classList.add('show');
    }
    function hideBanner() {
      bannerEl.classList.remove('show');
    }

    function cellCenter(x, y) {
      return { px: x * TILE + TILE / 2, py: y * TILE + TILE / 2 };
    }

    function render() {
      var level = state.level;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var y = 0; y < level.height; y++) {
        for (var x = 0; x < level.width; x++) {
          var tile = level.grid[y][x];
          ctx.fillStyle = TILE_COLORS[tile] || '#1a1d29';
          ctx.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1);
          if (GATE_ARROW[tile]) {
            ctx.fillStyle = '#dff6ff';
            ctx.font = (TILE * 0.5) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(GATE_ARROW[tile], x * TILE + TILE / 2, y * TILE + TILE / 2);
          }
          if (tile === '1' || tile === '2') {
            ctx.fillStyle = '#f0d6ff';
            ctx.font = 'bold ' + (TILE * 0.45) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tile, x * TILE + TILE / 2, y * TILE + TILE / 2);
          }
        }
      }

      if (state.hint && !state.animPath) {
        var hd = DriftMaze.DIRS[state.hint];
        var hc = cellCenter(state.pos.x, state.pos.y);
        ctx.strokeStyle = '#ffd866';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(hc.px, hc.py);
        ctx.lineTo(hc.px + hd.dx * TILE * 0.8, hc.py + hd.dy * TILE * 0.8);
        ctx.stroke();
        ctx.fillStyle = '#ffd866';
        ctx.beginPath();
        ctx.arc(hc.px + hd.dx * TILE * 0.8, hc.py + hd.dy * TILE * 0.8, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // player
      var playerPx;
      if (state.animPath && state.animPath.length > 1) {
        var t = Math.min(1, (performance.now() - state.animStart) / state.animDuration);
        var segCount = state.animPath.length - 1;
        var segF = t * segCount;
        var segI = Math.min(segCount - 1, Math.floor(segF));
        var localT = segF - segI;
        var a = state.animPath[segI], b = state.animPath[segI + 1];
        var ac = cellCenter(a.x, a.y), bc = cellCenter(b.x, b.y);
        playerPx = {
          px: ac.px + (bc.px - ac.px) * localT,
          py: ac.py + (bc.py - ac.py) * localT,
        };
      } else {
        var c = cellCenter(state.pos.x, state.pos.y);
        playerPx = c;
      }
      ctx.fillStyle = '#6ee7ff';
      ctx.beginPath();
      ctx.arc(playerPx.px, playerPx.py, TILE * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    function isAnimating() {
      return state.animPath && (performance.now() - state.animStart) < state.animDuration;
    }

    function finishAnimation() {
      state.animPath = null;
      if (state.pendingDir) {
        var d = state.pendingDir;
        state.pendingDir = null;
        attemptMove(d);
      }
    }

    function attemptMove(dir) {
      if (state.solved || state.cleared) return;
      if (isAnimating()) {
        state.pendingDir = dir; // queue: apply once current tween finishes
        return;
      }
      var level = state.level;
      var snapshot = { pos: state.pos, grid: DriftMaze.cloneGrid(level.grid), moves: state.moves };
      var result = DriftMaze.slide(level.grid, level.width, level.height, state.pos, dir);
      if (!result.acted) return;

      state.history.push(snapshot);
      state.hint = null;
      state.moves++;
      var fullPath = [{ x: state.pos.x, y: state.pos.y }].concat(result.path);
      state.pos = result.stoppedAt;
      updateHud();

      state.animPath = fullPath;
      state.animStart = performance.now();
      state.animDuration = Math.max(120, fullPath.length * 55);

      if (result.hitExit) {
        state.solved = true;
        window.setTimeout(function () { onLevelSolved(); }, state.animDuration + 80);
      }
    }

    function undo() {
      if (state.solved || isAnimating() || !state.history.length) return;
      var snap = state.history.pop();
      state.level.grid = snap.grid;
      state.pos = snap.pos;
      state.moves = snap.moves;
      state.hint = null;
      state.animPath = null;
      updateHud();
      render();
    }

    // Asks the exact solver for the best next move from the current position.
    function showHint() {
      if (state.solved || isAnimating()) return null;
      var sol = DriftMaze.solveLevel(state.level, { grid: state.level.grid, pos: state.pos });
      if (!sol.solvable) {
        showBanner('No way out from here<div class="sub">U to undo, R to reset.</div>');
        window.setTimeout(hideBanner, 1400);
        return null;
      }
      state.hint = sol.moves[0];
      render();
      return state.hint;
    }

    function onLevelSolved() {
      var verdict = state.moves <= state.par ? 'Par!' : (state.moves - state.par) + ' over par';
      var sub = 'Moves: ' + state.moves + ' / par ' + state.par + ' — ' + verdict;
      if (state.mode === 'endless') {
        state.runMoves += state.moves;
        state.runPar += state.par;
        showBanner('Depth ' + state.depth + ' cleared<div class="sub">' + sub + '</div>');
        window.setTimeout(function () { loadEndless(state.depth + 1); }, 1100);
        return;
      }
      var isLast = state.levelIndex >= DRIFT_MAZE_LEVELS.length - 1;
      if (isLast) {
        state.cleared = true;
        showBanner('Campaign complete!<div class="sub">' + sub + '<br>Press M for Endless mode.</div>');
      } else {
        showBanner('Level complete!<div class="sub">' + sub + '</div>');
        window.setTimeout(function () { loadLevel(state.levelIndex + 1); }, 1100);
      }
    }

    var KEY_DIR = {
      ArrowUp: 'up', KeyW: 'up',
      ArrowDown: 'down', KeyS: 'down',
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right',
    };

    window.addEventListener('keydown', function (e) {
      if (e.code === 'KeyR') { reloadCurrent(); return; }
      if (e.code === 'KeyU' || e.code === 'KeyZ') { undo(); return; }
      if (e.code === 'KeyH') { showHint(); return; }
      if (e.code === 'KeyN') { startEndlessRun(Math.floor(Math.random() * 1e6)); return; }
      if (e.code === 'KeyM') {
        if (state.mode === 'campaign') startEndlessRun(state.runSeed);
        else loadLevel(0);
        return;
      }
      var dir = KEY_DIR[e.code];
      if (dir) {
        e.preventDefault();
        attemptMove(dir);
      }
    });

    function loop() {
      if (isAnimating()) {
        render();
      } else if (state.animPath) {
        finishAnimation();
        render();
      }
      requestAnimationFrame(loop);
    }

    if (state.mode === 'endless') startEndlessRun(state.runSeed);
    else loadLevel(0);
    requestAnimationFrame(loop);

    // Test hook: exposes read-only live state for automated smoke tests, mirroring
    // the getter pattern used by Cycle 1's Orbit Duel prototype (a plain snapshot
    // property would go stale since `state` fields are reassigned, not mutated in
    // place).
    window.__driftMaze = {
      get levelIndex() { return state.levelIndex; },
      get pos() { return state.pos; },
      get moves() { return state.moves; },
      get solved() { return state.solved; },
      get cleared() { return state.cleared; },
      get mode() { return state.mode; },
      get depth() { return state.depth; },
      get runSeed() { return state.runSeed; },
      get par() { return state.par; },
      get def() { return state.def; },
      get grid() { return state.level.grid; },
      get hint() { return state.hint; },
      get runMoves() { return state.runMoves; },
      get runPar() { return state.runPar; },
      attemptMove: attemptMove,
      loadLevel: loadLevel,
      startEndlessRun: startEndlessRun,
      undo: undo,
      showHint: showHint,
    };
  })();
  </script>
</body>
</html>
